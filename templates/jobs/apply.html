
<!DOCTYPE html>
<html>
<head>
    <title>Apply for Job - AI Job Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
            margin: 15px 0;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Apply for Job</h1>

    <h2>{{ job.title }}</h2>

    <p><strong>Company:</strong> {{ job.company }}</p>

    <form method="POST">
        {% csrf_token %}

        <label>Write Your Cover Letter:</label>

        <textarea name="cover_letter"
                  placeholder="Why are you suitable for this job?"
                  required></textarea>

        <button type="submit">Submit Application</button>
    </form>

</div>

</body>
</html>
