
<!DOCTYPE html>
<html>
<head>
    <title>Upload Resume - AI Job Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        input {
            margin: 20px 0;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .resume {
            background: #f4f6f9;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Upload Your Resume</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Select your PDF resume:</label><br>

        <input type="file" name="resume_file" accept=".pdf" required>

        <br>

        <button type="submit">Upload Resume</button>
    </form>

    <hr>

    <h2>My Uploaded Resumes</h2>

    {% for resume in resumes %}
        <div class="resume">
            {{ resume.resume_file.name }}

<br>

<small>Uploaded: {{ resume.uploaded_at }}</small>

<br><br>

<a href="{% url 'analyze_resume' resume.id %}"
   style="background:#2563eb; color:white; padding:10px 15px;
   text-decoration:none; border-radius:5px;">
   Analyze Resume
</a>
        </div>
    {% empty %}
        <p>No resumes uploaded yet.</p>
    {% endfor %}

</div>

</body>
</html>
